<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDBA8"/>
      <stop offset="100%" stop-color="#FFAB5E"/>
    </linearGradient>
    <filter id="softFrost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- mark: transparent canvas, no background tile -->
  <g filter="url(#markShadow)" transform="translate(128 128) scale(1.8) translate(-128 -132)">

  <!-- redacted line 1 -->
  <rect x="66" y="90" width="124" height="20" rx="10" fill="#141414" opacity="0.85" filter="url(#softFrost)"/>

  <!-- redacted line 2, left segment (lens interrupts the middle) -->
  <rect x="66" y="122" width="42" height="20" rx="10" fill="#141414" opacity="0.7" filter="url(#softFrost)"/>
  <!-- redacted line 2, right segment -->
  <rect x="148" y="122" width="42" height="20" rx="10" fill="#141414" opacity="0.7" filter="url(#softFrost)"/>

  <!-- redacted line 3 -->
  <rect x="66" y="154" width="92" height="20" rx="10" fill="#141414" opacity="0.55" filter="url(#softFrost)"/>

  <!-- lens / reveal accent, centered on line 2 -->
  <circle cx="128" cy="132" r="22" fill="#141414"/>
  <circle cx="128" cy="132" r="19" fill="none" stroke="#FFDBA8" stroke-width="3.5"/>
  <circle cx="128" cy="132" r="12" fill="url(#lensGrad)"/>
  <circle cx="128" cy="132" r="4.5" fill="#141414"/>

  </g>
</svg>
